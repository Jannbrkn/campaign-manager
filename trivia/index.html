<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-Trivia</title>
<style>
  :root {
    --bg: #0E1116;
    --surface: #171B22;
    --surface-2: #1F242D;
    --border: #2A303B;
    --text: #F2EFE9;
    --muted: #98A0AE;
    --accent: #FFB868;
    --accent-ink: #1A1206;
    --easy: #7BC47F;
    --medium: #E8B34D;
    --hard: #E07A6B;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Home ---------- */
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1.title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-top: 4px;
    text-wrap: balance;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .chips {
    display: flex;
    gap: 6px;
    margin: 22px 0 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
  }
  .chip {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .chip[data-d="1"][aria-pressed="true"] { color: var(--easy); }
  .chip[data-d="2"][aria-pressed="true"] { color: var(--medium); }
  .chip[data-d="3"][aria-pressed="true"] { color: var(--hard); }

  .btn-random {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 18px;
  }
  .btn-random:active { transform: scale(0.98); }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cat-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 14px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-align: left;
    min-height: 104px;
    overflow: hidden;
  }
  .cat-tile::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--cat-color);
    opacity: 0.9;
  }
  .cat-tile:active { background: var(--surface-2); }
  .cat-tile .emoji { font-size: 26px; }
  .cat-tile .name { font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .cat-tile .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat-tile[disabled] { opacity: 0.45; }

  .home-footer { margin-top: 22px; text-align: center; }
  .btn-ghost {
    padding: 12px 18px;
    border-radius: 12px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .btn-ghost:active { color: var(--text); }

  /* ---------- Question screen ---------- */
  .q-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .btn-back {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;

  .badge-cat {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 13px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    min-width: 0;
  }
  .badge-cat .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cat-color); }
  .badge-cat .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge-diff {
    margin-left: auto;
    flex: none;
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid;
  }
  .badge-diff[data-d="1"] { color: var(--easy); border-color: color-mix(in srgb, var(--easy) 45%, transparent); }
  .badge-diff[data-d="2"] { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 45%, transparent); }
  .badge-diff[data-d="3"] { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }

  .q-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    padding: 12px 0;
  }
  .q-inner {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .q-text {
    font-size: clamp(21px, 5.8vw, 27px);
    font-weight: 750;
    line-height: 1.32;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hint-box, .answer-box {
    border-radius: var(--radius);
    padding: 15px 16px;
    font-size: 16px;
    line-height: 1.45;
    animation: rise 0.22s ease-out;
  }
  .hint-box {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
    color: color-mix(in srgb, var(--accent) 85%, white);
  }
  .hint-box .k, .answer-box .k {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.75;
  }
  .answer-box {
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 19px;
    font-weight: 700;
  }
  .answer-box .k { color: var(--accent); }
  .btn-hint {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
  }
  .btn-hint:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  .q-bottom { display: flex; flex-direction: column; gap: 10px; }
  .btn-reveal, .btn-next {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius);
    font-size: 17px;
    font-weight: 700;
  }
  .btn-reveal { background: var(--surface-2); border: 1px solid var(--border); }
  .btn-reveal:active { background: var(--border); }
  .btn-next { background: var(--accent); color: var(--accent-ink); }
  .btn-next:active { transform: scale(0.98); }
  .q-counter { text-align: center; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* ---------- Done screen ---------- */
  .done {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  .done .big { font-size: 52px; }
  .done h2 { font-size: 23px; font-weight: 800; text-wrap: balance; }
  .done p { color: var(--muted); font-size: 15px; max-width: 30ch; }
  .done .q-bottom { width: 100%; margin-top: 14px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint-box, .answer-box { animation: none; }
    .btn-random:active, .btn-next:active { transform: none; }
  }
</style>

Wesen versteinert jeden, der es anblickt?","a":"Medusa","hint":"Sie hat Schlangen statt Haare.","d":3},{"q":"Wie funktioniert die Fibonacci-Folge?","a":"Jede Zahl ist die Summe der beiden vorherigen: 1, 1, 2, 3, 5, 8, 13 …","hint":"Man findet sie überall in der Natur.","d":3},{"q":"Wie heißt Luke Skywalkers Heimatplanet?","a":"Tatooine","hint":"Er hat zwei Sonnen.","d":3},{"q":"Was bedeutet „Open Source\" bei Software?","a":"Der Quellcode ist offen einsehbar und darf verändert werden","hint":"Das Gegenteil von proprietär.","d":3},{"q":"Wie heißt der dreiköpfige Höllenhund der griechischen Unterwelt?","a":"Zerberus","hint":"Heute ein Wort für strenge Türsteher.","d":3},{"q":"Welches Videospiel ist mit über 300 Millionen Verkäufen das meistverkaufte aller Zeiten?","a":"Minecraft","hint":"Alles besteht aus Blöcken.","d":3},{"q":"Wofür steht die Abkürzung „RAM\"?","a":"Random Access Memory — der Arbeitsspeicher","hint":"Er vergisst alles beim Ausschalten.","d":3},{"q":"Was war der erste dokumentierte Computer-„Bug\" — wortwörtlich?","a":"Eine Motte, die 1947 in einem Relais des Harvard Mark II klemmte","hint":"Es war wirklich ein Insekt.","d":3}]}];

// Flat question list; id is stable (category key + index) so localStorage survives reloads.
var ALL = [];
CATEGORIES.forEach(function (c) {
  c.questions.forEach(function (q, i) {
    ALL.push({ id: c.key + ':' + i, cat: c, q: q.q, a: q.a, hint: q.hint, d: q.d });
  });
});

var LS_KEY = 'autotrivia_used_v1';
var used = loadUsed();
var diffFilter = 0; // 0 = alle
var DIFF_NAMES = { 1: 'Leicht', 2: 'Mittel', 3: 'Schwer' };

function loadUsed() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function saveUsed() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(used))); } catch (e) { /* private mode */ }
}

function pool(catKey) {
  return ALL.filter(function (x) {
    if (used.has(x.id)) return false;
    if (diffFilter && x.d !== diffFilter) return false;
    if (catKey && x.cat.key !== catKey) return false;
    return true;
  });
}
function totalFor(catKey) {
  return ALL.filter(function (x) {
    if (diffFilter && x.d !== diffFilter) return false;
    if (catKey && x.cat.key !== catKey) return false;
    return true;
  }).length;
}

var app = document.getElementById('app');
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------- Home ---------- */
function renderHome() {
  app.innerHTML = '';
  var open = pool(null).length;

  var eyebrow = el('div', 'eyebrow', 'Roadtrip-Quiz');
  var title = el('h1', 'title', 'Auto-Trivia');
  var sub = el('div', 'subtitle', open + ' von ' + totalFor(null) + ' Fragen übrig' + (diffFilter ? ' · ' + DIFF_NAMES[diffFilter] : ''));
  app.append(eyebrow, title, sub);

  var chips = el('div', 'chips');
  [[0, 'Alle'], [1, 'Leicht'], [2, 'Mittel'], [3, 'Schwer']].forEach(function (opt) {
    var b = el('button', 'chip', opt[1]);
    b.dataset.d = opt[0];
    b.setAttribute('aria-pressed', String(diffFilter === opt[0]));
    b.addEventListener('click', function () { diffFilter = opt[0]; renderHome(); });
    chips.appendChild(b);
  });
  app.appendChild(chips);

  var rnd = el('button', 'btn-random', '🎲  Zufällige Frage');
  rnd.disabled = open === 0;
  if (open === 0) rnd.style.opacity = '0.45';
  rnd.addEventListener('click', function () { draw(null); });
  app.appendChild(rnd);

  var grid = el('div', 'cat-grid');
  CATEGORIES.forEach(function (c) {
    var left = pool(c.key).length;
    var tile = el('button', 'cat-tile');
    tile.style.setProperty('--cat-color', c.color);
    if (left === 0) tile.disabled = true;
    tile.append(
      el('span', 'emoji', c.emoji),
      el('span', 'name', c.name),
      el('span', 'count', left + ' / ' + totalFor(c.key) + ' übrig')
    );
    tile.addEventListener('click', function () { draw(c.key); });
    grid.appendChild(tile);
  });
  app.appendChild(grid);

  var foot = el('div', 'home-footer');
  var reset = el('button', 'btn-ghost', '↺ Fragen zurücksetzen');
  reset.addEventListener('click', function () {
    if (used.size === 0) return;
    if (confirm('Alle ' + used.size + ' gespielten Fragen wieder freigeben?')) {
      used = new Set();
      saveUsed();
      renderHome();
    }
  });
  foot.appendChild(reset);
  app.appendChild(foot);
}

/* ---------- Question ---------- */
function draw(catKey) {
  var p = pool(catKey);
  if (p.length === 0) { renderDone(catKey); return; }
  var x = p[Math.floor(Math.random() * p.length)];
  used.add(x.id);
  saveUsed();
  renderQuestion(x, catKey);
}

function renderQuestion(x, catKey) {
  app.innerHTML = '';
  var hintShown = false, answerShown = false;

  var top = el('div', 'q-top');
  var back = el('button', 'btn-back', '←');
  back.setAttribute('aria-label', 'Zurück zur Übersicht');
  back.addEventListener('click', renderHome);
  var badge = el('span', 'badge-cat');
  badge.style.setProperty('--cat-color', x.cat.color);
  badge.append(el('span', 'dot'), el('span', 'label', x.cat.emoji + ' ' + x.cat.name));
  var diff = el('span', 'badge-diff', DIFF_NAMES[x.d]);
  diff.dataset.d = x.d;
  top.append(back, badge, diff);
  app.appendChild(top);

  var main = el('div', 'q-main');
  var inner = el('div', 'q-inner');
  main.appendChild(inner);
  var qText = el('div', 'q-text', x.q);
  inner.appendChild(qText);

  var hintSlot = el('div');
  var hintBtn = el('button', 'btn-hint', '💡 Tipp anzeigen');
  hintBtn.addEventListener('click', function () {
    if (hintShown) return;
    hintShown = true;
    var box = el('div', 'hint-box');
    box.append(el('span', 'k', 'Tipp'), document.createTextNode(x.hint));
    hintSlot.innerHTML = '';
    hintSlot.appendChild(box);
  });
  hintSlot.appendChild(hintBtn);
  inner.appendChild(hintSlot);

  var answerSlot = el('div');
  inner.appendChild(answerSlot);
  app.appendChild(main);

  var bottom = el('div', 'q-bottom');
  var action = el('button', 'btn-reveal', 'Antwort aufdecken');
  action.addEventListener('click', function () {
    if (!answerShown) {
      answerShown = true;
      var box = el('div', 'answer-box');
      box.append(el('span', 'k', 'Antwort'), document.createTextNode(x.a));
      answerSlot.appendChild(box);
      action.className = 'btn-next';
      action.textContent = 'Nächste Frage  →';
    } else {
      draw(catKey);
    }
  });
  var counter = el('div', 'q-counter', pool(catKey).length + ' Fragen übrig in dieser Auswahl');
  bottom.append(action, counter);
  app.appendChild(bottom);
}

/* ---------- Done ---------- */
function renderDone(catKey) {
  app.innerHTML = '';
  var scope = catKey
    ? CATEGORIES.filter(function (c) { return c.key === catKey; })[0].name
    : 'dieser Auswahl';
  var box = el('div', 'done');
  box.append(
    el('div', 'big', '🏁'),
    el('h2', null, 'Alle Fragen durchgespielt!'),
    el('p', null, 'In ' + scope + ' ist nichts mehr übrig' + (diffFilter ? ' (' + DIFF_NAMES[diffFilter] + ')' : '') + '. Setzt die Fragen zurück — oder nehmt eine andere Kategorie.')
  );
  var bottom = el('div', 'q-bottom');
  var reset = el('button', 'btn-next', '↺ Fragen zurücksetzen');
  reset.addEventListener('click', function () {
    used = new Set();
    saveUsed();
    renderHome();
  });
  var home = el('button', 'btn-reveal', 'Zur Übersicht');
  home.addEventListener('click', renderHome);
  bottom.append(reset, home);
  box.appendChild(bottom);
  app.appendChild(box);
}

renderHome();
</script>
